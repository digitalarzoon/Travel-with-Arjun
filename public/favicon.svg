<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    {/* Squircle gradient matching the image's deep emerald / rich teal */}
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a6e5f" />
      <stop offset="50%" stop-color="#145a4e" />
      <stop offset="100%" stop-color="#0d4137" />
    </linearGradient>

    {/* Radiant gold gradient for star */}
    <linearGradient id="goldStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd464" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    {/* Tie / diamond needle gradients for 3D depth */}
    <linearGradient id="tieLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="tieRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.3"/>
    </filter>
  </defs>

  {/* Squircle Background with soft rounded corners */}
  <rect width="100" height="100" rx="24" fill="url(#logoBgGrad)" />
  <rect width="100" height="100" rx="24" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5" fill="none" />

  {/* Concentric radar / sonar rings centered near the summit */}
  <circle cx="50" cy="50" r="37" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.5" />
  <circle cx="50" cy="50" r="27" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.5" />
  <circle cx="50" cy="50" r="17" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1.5" />

  {/* Mountain Silhouettes */}
  {/* Right peak (behind, darker translucent teal) */}
  <polygon points="34,75 63,36 85,75" fill="#0c4439" fill-opacity="0.75" />
  <polygon points="63,36 85,75 74,75" fill="#07332b" fill-opacity="0.5" />

  {/* Left peak (primary foreground peak pointing to star) */}
  <polygon points="15,75 42,32 68,75" fill="#2dd4bf" fill-opacity="0.35" />
  <polygon points="42,32 68,75 55,75" fill="#145e51" fill-opacity="0.45" />

  {/* Golden 5-pointed Star on left summit peak */}
  <polygon
    points="42,20 45,26.5 52,27.5 47,32 48.5,39 42,35.5 35.5,39 37,32 32,27.5 39,26.5"
    fill="url(#goldStarGrad)"
    filter="url(#shadow)"
  />

  {/* White Collar / Waypoint Pin Head */}
  <circle cx="50" cy="46" r="3.75" fill="#ffffff" filter="url(#shadow)" />

  {/* Golden Tie / Faceted Compass Needle */}
  {/* Left facet */}
  <polygon points="50,51 46,63 50,75 50,51" fill="url(#tieLeftGrad)" />
  {/* Right facet */}
  <polygon points="50,51 54,63 50,75 50,51" fill="url(#tieRightGrad)" />
</svg>
